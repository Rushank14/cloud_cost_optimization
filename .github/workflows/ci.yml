name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install dbt-duckdb duckdb
        
    - name: Run Linters (Ruff & Mypy)
      run: |
        ruff check .
        mypy src/ --ignore-missing-imports
        
    - name: Run Unit Tests
      run: |
        pytest tests/
        
    - name: dbt parse and test
      run: |
        # Generate some mock data for dbt to test against
        python -m src.mock_data.generator
        python -m src.ingest.loader
        
        # Move to dbt project and run parse/test
        cd dbt_project
        dbt deps --profiles-dir .
        dbt parse --profiles-dir .
        dbt build --profiles-dir .
