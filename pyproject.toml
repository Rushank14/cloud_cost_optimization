[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-cost-optimization"
version = "0.1.0"
description = "Cloud Data Warehouse Cost-Optimization Pipeline"
requires-python = ">=3.9"
dependencies = [
    "google-cloud-bigquery>=3.11.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "faker>=19.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
airflow = [
    "apache-airflow>=2.7.0",
    "apache-airflow-providers-google>=10.9.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
